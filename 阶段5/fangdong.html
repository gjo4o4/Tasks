<!DOCTYPE html>
<html lang="zh‑CN">
<body>
  <input id="searchInput" placeholder="请输入内容">
  <p>实际请求执行次数：<span id="debounceCount">0</span></p >

  <script>
    // 防抖函数
    function debounce(fn, delay) {
      let timer = null
      return function (...args) {
        clearTimeout(timer)
        timer = setTimeout(() => {
          fn.apply(this, args)
        }, delay)
      }
    }

    let count = 0
    function handleSearch(val) {
      count++
      document.getElementById('debounceCount').innerText = count
      console.log('发起搜索：', val)
    }

    const input = document.getElementById('searchInput')
    // 包装防抖，500ms延迟
    const debounceSearch = debounce(handleSearch, 500)
    input.addEventListener('input', e => {
      debounceSearch(e.target.value)
    })
  </script>
</body>
</html>
